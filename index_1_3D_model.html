<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- =========================================================
     Image Target —— 3D 模型

     这一部分决定 AR 识别成功后显示什么 3D 模型，
     以及模型在 Image Target 上的位置、方向和大小。

     自己制作项目时，主要需要修改 4 个参数：

     1. src
        指定要显示的 3D 模型文件。
        例如：src="./guang.glb"
        如果换成自己的模型，例如 temple.glb，
        就改成：src="./temple.glb"

     2. position="X Y Z"
        控制模型的位置。
        X = 左 / 右
        Y = 上 / 下
        Z = 离开 Target 平面的距离

        例如：
        position="0 0 0.1"
        表示模型位于 Target 中心，并稍微浮在图片上方。

     3. rotation="X Y Z"
        控制模型的旋转角度，单位为“度”。
        X = 前后翻转
        Y = 左右旋转
        Z = 平面旋转

        例如：
        rotation="0 180 0"
        表示模型绕 Y 轴旋转 180°。

     4. scale="X Y Z"
        控制模型大小。
        为避免模型变形，一般三个数字保持相同。

        scale="1 1 1"   = 原始大小
        scale="3 3 3"   = 放大 3 倍
        scale="0.5 0.5 0.5" = 缩小到一半

     建议调整顺序：
     Scale → Rotation → Position
     先把大小调合适，再调整方向，最后微调位置。
========================================================= -->
      <a-gltf-model src="./guang.glb" position="0 0 0.2" rotation="0 0 0" scale="3 3 3">
      </a-gltf-model>

    </a-entity>

  </a-scene>

</body>

</html>
