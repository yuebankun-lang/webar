<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- =========================================================
     3D 模型 + 自动旋转

     结构分成两层：

     modelRoot：
     控制整个文物的位置和大小。

     spinRoot：
     专门负责自动旋转。
========================================================= -->

      <!-- MODEL ROOT：控制模型整体位置与大小 -->
      <a-entity id="modelRoot" position="0 0 0.1" scale="3 3 3">

        <!--
       AUTO ROTATION：自动旋转

       property: rotation
       = 改变物体的旋转角度

       from: 0 0 0
       = 从 0° 开始

       to: 0 360 0
       = 绕 Y 轴旋转一整圈 360°

       loop: true
       = 无限循环

       dur: 10000
       = 一整圈需要 10,000 ms
       = 10 秒

       easing: linear
       = 保持匀速旋转
      -->

        <a-entity id="spinRoot" animation="
      property: rotation;
      from: 0 0 0;
      to: 0 360 0;
      loop: true;
      dur: 10000;
      easing: linear">

          <!-- 3D 模型____相对于MODEL ROOT 的位置（局部坐标系）-->
          <a-gltf-model src="./guang.glb" position="0 0 0" rotation="0 0 0">
          </a-gltf-model>

        </a-entity>

      </a-entity>

    </a-entity>

  </a-scene>

</body>

</html>
