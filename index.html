<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR Integrated Demo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #000;
    }

    canvas {
      touch-action: none;
    }

    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      z-index: 9999;
    }

    #startButton {
      padding: 16px 34px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #fff;
      color: #222;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    #infoPanel {
      display: none;
      position: fixed;
      left: 20px;
      bottom: 24px;
      max-width: 300px;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      border-radius: 12px;
      z-index: 5000;
      line-height: 1.6;
    }

    .objectTitle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .objectInfo {
      font-size: 14px;
      opacity: 0.92;
    }

    #explorePrompt {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: min(420px, 82vw);
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border-radius: 12px;
      text-align: center;
      z-index: 6000;
    }

    .exploreTitle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .exploreText {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.9;
    }

    #exploreButton {
      margin-top: 12px;
      padding: 10px 22px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ffd65a;
      color: #222;
    }

    #hotspotInfo {
      display: none;
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: min(280px, calc(100vw - 40px));
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.82);
      color: #fff;
      border-radius: 12px;
      z-index: 7000;
      line-height: 1.6;
    }

    #hotspotTitle {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    #hotspotText {
      font-size: 14px;
      opacity: 0.92;
    }
  </style>
</head>

<body>
  <div id="startScreen">
    <button id="startButton">开始体验</button>
  </div>

  <audio id="bgMusic" src="./background_music.mp3" preload="auto" loop></audio>
  <audio id="narration" src="./narration_voice.mp3" preload="auto"></audio>

  <div id="infoPanel">
    <div class="objectTitle">商代晚期青铜觥</div>
    <div class="objectInfo">
      约公元前 1100–1050 年<br>
      青铜｜礼仪酒器<br>
      馆藏：Smithsonian National Museum of Asian Art
    </div>
  </div>

  <div id="explorePrompt">
    <div class="exploreTitle">探索文物</div>
    <div class="exploreText">
      拖动模型进行旋转，使用鼠标滚轮或双指捏合进行缩放。<br>
      点击黄色标记，发现饕餮、龙和鸟三种纹饰。
    </div>
    <button id="exploreButton">开始探索</button>
  </div>

  <div id="hotspotInfo">
    <div id="hotspotTitle">纹样说明</div>
    <div id="hotspotText">点击热点查看详细信息。</div>
  </div>

  <a-scene id="scene" mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse; fuse: false">
      <a-cursor color="#ffffff" scale="0.8 0.8 0.8" raycaster="objects: .hotspot"></a-cursor>
    </a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-entity id="modelRoot" position="0 0 0.15" scale="0.1 0.1 0.1">
        <a-entity id="spinRoot" animation="
          property: rotation;
          from: 0 0 0;
          to: 0 360 0;
          loop: true;
          dur: 10000;
          easing: linear">
          <a-gltf-model src="./guang.glb" position="0 0 0" rotation="0 0 0"></a-gltf-model>
        </a-entity>

        <a-entity id="hotspotRoot" visible="false">
          <a-sphere class="hotspot" data-title="饕餮纹" data-text="饕餮纹是青铜器上常见的神兽纹样，象征威严与吉祥，强调器物的礼仪功能。"
            position="-0.75 0.65 0.18" radius="0.08" color="#ffd75a" material="opacity: 0.95"></a-sphere>

          <a-sphere class="hotspot" data-title="龙纹" data-text="龙纹象征力量与天威，常用于祭礼器物，体现商代社会对神灵秩序的重视。"
            position="0 1.0 0.18" radius="0.08" color="#ffd75a" material="opacity: 0.95"></a-sphere>

          <a-sphere class="hotspot" data-title="鸟纹" data-text="鸟纹表现了商代艺术中对自然与祖先观念的融合，兼具装饰性和象征意义。"
            position="0.8 0.6 0.18" radius="0.08" color="#ffd75a" material="opacity: 0.95"></a-sphere>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const startScreen = document.querySelector('#startScreen');
    const startButton = document.querySelector('#startButton');
    const target = document.querySelector('#target');
    const bgMusic = document.querySelector('#bgMusic');
    const narration = document.querySelector('#narration');
    const infoPanel = document.querySelector('#infoPanel');
    const explorePrompt = document.querySelector('#explorePrompt');
    const exploreButton = document.querySelector('#exploreButton');
    const modelRoot = document.querySelector('#modelRoot');
    const spinRoot = document.querySelector('#spinRoot');
    const hotspotRoot = document.querySelector('#hotspotRoot');
    const hotspotInfo = document.querySelector('#hotspotInfo');
    const hotspotTitle = document.querySelector('#hotspotTitle');
    const hotspotText = document.querySelector('#hotspotText');

    bgMusic.volume = 0.8;
    narration.volume = 1.0;

    let experienceStarted = false;
    let targetVisible = false;
    let narrationFinished = false;
    let exploring = false;

    startButton.addEventListener('click', async () => {
      try {
        bgMusic.muted = true;
        await bgMusic.play();
        bgMusic.pause();
        bgMusic.currentTime = 0;
        bgMusic.muted = false;

        narration.muted = true;
        await narration.play();
        narration.pause();
        narration.currentTime = 0;
        narration.muted = false;
      } catch (error) {
        console.log('Audio unlock error:', error);
      }

      experienceStarted = true;
      startScreen.style.display = 'none';

      if (targetVisible) {
        infoPanel.style.display = 'block';
        playAudio();
      }
    });

    function playAudio() {
      if (!experienceStarted) return;

      bgMusic.play().catch((error) => {
        console.log('Background music error:', error);
      });

      if (!narrationFinished) {
        narration.play().catch((error) => {
          console.log('Narration error:', error);
        });
      }
    }

    target.addEventListener('targetFound', () => {
      console.log('🎯 Target found');
      targetVisible = true;
      infoPanel.style.display = 'block';
      playAudio();
    });

    target.addEventListener('targetLost', () => {
      console.log('Target lost');
      targetVisible = false;
      bgMusic.pause();
      narration.pause();
    });

    narration.addEventListener('ended', () => {
      narrationFinished = true;
      explorePrompt.style.display = 'block';
    });

    exploreButton.addEventListener('click', () => {
      exploring = true;
      explorePrompt.style.display = 'none';
      hotspotRoot.setAttribute('visible', 'true');
      stopAutoRotation();
    });

    function stopAutoRotation() {
      spinRoot.removeAttribute('animation');
    }

    function showHotspotInfo(hotspot) {
      const title = hotspot.getAttribute('data-title') || '纹样说明';
      const text = hotspot.getAttribute('data-text') || '点击热点查看内容。';
      hotspotTitle.textContent = title;
      hotspotText.textContent = text;
      hotspotInfo.style.display = 'block';
    }

    document.querySelectorAll('.hotspot').forEach((hotspot) => {
      hotspot.addEventListener('click', () => {
        showHotspotInfo(hotspot);
      });
    });

    let currentScale = Number(modelRoot.getAttribute('scale').x) || 1;
    let currentRotationY = 0;

    const initialScale = currentScale;
    const minScale = initialScale * 0.5;
    const maxScale = initialScale * 7;

    function setModelScale(scale) {
      const clamped = Math.min(Math.max(scale, minScale), maxScale);
      modelRoot.setAttribute('scale', `${clamped} ${clamped} ${clamped}`);
      currentScale = clamped;
    }

    const activePointers = new Map();
    let lastSingleX = null;
    let pinchStartDistance = null;
    let pinchStartScale = currentScale;

    function getPointerDistance(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    document.addEventListener('pointerdown', (event) => {
      if (!exploring) return;
      activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

      if (activePointers.size === 1) {
        lastSingleX = event.clientX;
      } else if (activePointers.size === 2) {
        const points = Array.from(activePointers.values());
        pinchStartDistance = getPointerDistance(points[0], points[1]);
        pinchStartScale = currentScale;
      }
    });

    document.addEventListener('pointermove', (event) => {
      if (!exploring || !activePointers.has(event.pointerId)) return;

      activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

      if (activePointers.size === 1 && lastSingleX !== null) {
        const deltaX = event.clientX - lastSingleX;
        currentRotationY += deltaX * 0.4;
        modelRoot.setAttribute('rotation', `0 ${currentRotationY} 0`);
        lastSingleX = event.clientX;
      }

      if (activePointers.size >= 2) {
        const points = Array.from(activePointers.values());
        if (pinchStartDistance) {
          const currentDistance = getPointerDistance(points[0], points[1]);
          const ratio = currentDistance / pinchStartDistance;
          setModelScale(pinchStartScale * ratio);
        }
      }
    });

    function endPointer(event) {
      activePointers.delete(event.pointerId);

      if (activePointers.size < 2) {
        pinchStartDistance = null;
      }

      if (activePointers.size === 1) {
        const remaining = Array.from(activePointers.values())[0];
        lastSingleX = remaining ? remaining.x : null;
      } else {
        lastSingleX = null;
      }
    }

    document.addEventListener('pointerup', endPointer);
    document.addEventListener('pointercancel', endPointer);

    document.addEventListener('wheel', (event) => {
      if (!exploring) return;
      event.preventDefault();
      const factor = event.deltaY > 0 ? 0.94 : 1.06;
      setModelScale(currentScale * factor);
    }, { passive: false });
  </script>
</body>

</html>
