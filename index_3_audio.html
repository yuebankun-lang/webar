<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* =========================================================
    开始体验界面

   position: fixed
   固定覆盖整个屏幕

   z-index,数值越大，通常越靠前
   保证按钮显示在 AR 摄像头画面上方
========================================================= */

    #startScreen {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.47);

      z-index: 9999;
    }


    /* 开始体验按钮 */
    #startButton {
      padding: 16px 32px;

      font-size: 20px;

      border: none;
      border-radius: 10px;

      cursor: pointer;
    }
  </style>

</head>


<body>
  <!-- =========================================================
     开始体验按钮

     手机浏览器通常不允许网页直接自动播放声音。
     用户必须先进行一次点击，
     浏览器才允许后面的背景音乐和语音播放。
========================================================= -->
  <div id="startScreen">
    <button id="startButton">
      开始体验
    </button>
  </div>


  <!-- =========================================================
     音频资源

     bgMusic
     背景音乐

     narration
     中文语音讲解

     loop
     背景音乐播放结束后自动重新播放

     preload="auto"
     浏览器提前加载音频，减少播放等待时间
========================================================= -->

  <audio id="bgMusic" src="./background_music.mp3" preload="auto" loop>
  </audio>

  <audio id="narration" src="./narration_voice.mp3" preload="auto">
  </audio>


  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false">
    </a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- =========================================================
     3D 模型 + 自动旋转

     结构分成两层：

     modelRoot：
     控制整个文物的位置和大小。

     spinRoot：
     专门负责自动旋转。
========================================================= -->

      <!-- MODEL ROOT：控制模型整体位置与大小 -->
      <a-entity id="modelRoot" position="0 0 0.1" scale="3 3 3">

        <!--
       自动旋转

       property: rotation
       改变物体的旋转角度

       from: 0 0 0
       从 0° 开始

       to: 0 360 0
       绕 Y 轴旋转一整圈 360°

       loop: true
       无限循环

       dur: 10000
       一整圈需要 10,000 ms
       10 秒

       easing: linear
       保持匀速旋转
      -->

        <a-entity id="spinRoot" animation="
      property: rotation;
      from: 0 0 0;
      to: 0 360 0;
      loop: true;
      dur: 10000;
      easing: linear">

          <!-- 3D 模型___相对于MODEL ROOT 的位置（局部坐标系）-->
          <a-gltf-model src="./guang.glb" position="0 0 0" rotation="0 0 0">
          </a-gltf-model>

        </a-entity>

      </a-entity>

    </a-entity>

  </a-scene>

  <script>

    /* =========================================================
       音频交互控制
    
       整体逻辑：
    
       点击 "开始体验"
       ↓
       浏览器允许播放声音
       ↓
       扫描 Image Target
       ↓
       targetFound
       ↓
       背景音乐 + 中文讲解播放
    ========================================================= */


    /* ---------------------------------------------------------
       1. 找到网页中的元素
    --------------------------------------------------------- */

    const startScreen =
      document.querySelector("#startScreen");

    const startButton =
      document.querySelector("#startButton");

    const target =
      document.querySelector("#target");

    const bgMusic =
      document.querySelector("#bgMusic");

    const narration =
      document.querySelector("#narration");


    /* ---------------------------------------------------------
       2. 设置音量
    
       volume 范围：
    
       0   = 静音
       0.1 = 很低
       0.5 = 中等
       1   = 最大音量
    
       博物馆体验建议：
       背景音乐低
       讲解声音高
    --------------------------------------------------------- */

    bgMusic.volume = 0.8;

    narration.volume = 1.0;


    /* ---------------------------------------------------------
       3. 记录体验状态
    --------------------------------------------------------- */

    let experienceStarted = false;

    let targetVisible = false;

    let narrationFinished = false;


    /* ---------------------------------------------------------
       4. 用户点击「开始体验」
    
       这一步非常重要：
    
       手机浏览器要求用户先进行一次操作，
       才允许网页播放声音。
    
       play → pause
       是为了提前“解锁”两个音频。
    --------------------------------------------------------- */

    startButton.addEventListener("click", async () => {

      try {

        /* 解锁背景音乐 */

        bgMusic.muted = true;

        await bgMusic.play();

        bgMusic.pause();

        bgMusic.currentTime = 0;

        bgMusic.muted = false;


        /* 解锁语音讲解 */

        narration.muted = true;

        await narration.play();

        narration.pause();

        narration.currentTime = 0;

        narration.muted = false;

      }

      catch (error) {

        console.log(
          "Audio unlock:",
          error
        );

      }


      /* 记录：用户已经开始体验 */

      experienceStarted = true;


      /* 隐藏开始按钮 */

      startScreen.style.display = "none";


      /*
         如果用户点击按钮的时候
         Target 已经在摄像头里，
         就立即播放音频。
      */

      if (targetVisible) {

        playAudio();

      }

    });


    /* ---------------------------------------------------------
       5. 播放音频
    --------------------------------------------------------- */

    function playAudio() {

      /*
         如果用户还没有点击开始体验，
         不允许播放。
      */

      if (!experienceStarted) {

        return;

      }


      /* ---------- 背景音乐 ---------- */

      bgMusic.play().catch((error) => {

        console.log(
          "Background music error:",
          error
        );

      });


      /* ---------- 中文讲解 ---------- */

      if (!narrationFinished) {

        narration.play().catch((error) => {

          console.log(
            "Narration error:",
            error
          );

        });

      }

    }


    /* ---------------------------------------------------------
       6. 当 MindAR 识别到 Target
    --------------------------------------------------------- */

    target.addEventListener(
      "targetFound",
      () => {

        console.log(
          "🎯 TARGET FOUND"
        );

        targetVisible = true;

        playAudio();

      }
    );


    /* ---------------------------------------------------------
       7. 当 Target 离开摄像头
    
       暂停音频。
    
       注意：
       这里不是重新开始，
       下一次识别后会从暂停的位置继续播放。
    --------------------------------------------------------- */

    target.addEventListener(
      "targetLost",
      () => {

        console.log(
          "TARGET LOST"
        );

        targetVisible = false;

        bgMusic.pause();

        narration.pause();

      }
    );


    /* ---------------------------------------------------------
       8. 当 37 秒中文讲解结束
    
       暂时只记录状态。
    
       利用这个 ended 事件：f
       ↓
       后期显示「开始探索」
       
    --------------------------------------------------------- */

    narration.addEventListener(
      "ended",
      () => {

        narrationFinished = true;

        console.log(
          "🔊 Narration Finished"
        );

      }
    );

  </script>

</body>

</html>
