<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      touch-action: none;
    }

    /* =========================================================
    开始体验界面

   position: fixed
   固定覆盖整个屏幕

   z-index,数值越大，通常越靠前
   保证按钮显示在 AR 摄像头画面上方
========================================================= */

    #startScreen {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.47);

      z-index: 9999;
    }


    /* 开始体验按钮 */
    #startButton {
      padding: 16px 32px;

      font-size: 20px;

      border: none;
      border-radius: 10px;

      cursor: pointer;
    }

    /* =========================================================
   博物馆信息卡
========================================================= */

    #infoPanel {

      /* 初始状态不显示 */
      display: none;

      /* 固定在手机屏幕上 */
      position: fixed;

      left: 20px;
      bottom: 25px;

      /* 控制信息卡宽度 */
      max-width: 300px;

      /* 内部留白 */
      padding: 14px 18px;

      /* 半透明黑色背景 */
      background: rgba(0, 0, 0, 0.72);

      /* 白色文字 */
      color: white;

      /* 圆角 */
      border-radius: 10px;

      /* 保证显示在 AR 画面上方 */
      z-index: 5000;

      /* 字体 */
      font-family: Arial, "Microsoft YaHei", sans-serif;

      line-height: 1.6;
    }


    /* 文物名称 */

    .objectTitle {

      font-size: 19px;

      font-weight: bold;

      margin-bottom: 6px;
    }


    /* 文物基础信息 */

    .objectInfo {

      font-size: 14px;

      opacity: 0.9;
    }

    /* =========================================================
    开始探索提示
========================================================= */

    #explorePrompt {

      /* 一开始不显示 */
      display: none;

      /* 固定在屏幕上 */
      position: fixed;

      left: 50%;
      bottom: 30px;

      /*
     left: 50%
     + translateX(-50%)
     = 让提示框水平居中
  */
      transform: translateX(-50%);

      width: 80%;
      max-width: 360px;

      padding: 15px 20px;

      background: rgba(0, 0, 0, 0.82);

      color: white;

      border-radius: 12px;

      text-align: center;

      font-family: Arial, "Microsoft YaHei", sans-serif;

      z-index: 6000;
    }


    /* “开始探索”标题 */

    .exploreTitle {

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 6px;
    }


    /* 探索说明文字 */

    .exploreText {

      font-size: 14px;

      line-height: 1.6;

      opacity: 0.9;
    }


    /* =========================================================
   开始探索按钮
========================================================= */

    #exploreButton {

      margin-top: 12px;

      padding: 10px 24px;

      font-size: 16px;

      border: none;

      border-radius: 8px;

      cursor: pointer;
    }
  </style>

</head>


<body>
  <!-- =========================================================
     开始体验按钮

     手机浏览器通常不允许网页直接自动播放声音。
     用户必须先进行一次点击，
     浏览器才允许后面的背景音乐和语音播放。
========================================================= -->
  <div id="startScreen">
    <button id="startButton">
      开始体验
    </button>
  </div>


  <!-- =========================================================
     音频资源

     bgMusic
     背景音乐

     narration
     中文语音讲解

     loop
     背景音乐播放结束后自动重新播放

     preload="auto"
     浏览器提前加载音频，减少播放等待时间
========================================================= -->

  <audio id="bgMusic" src="./background_music.mp3" preload="auto" loop>
  </audio>

  <audio id="narration" src="./narration_voice.mp3" preload="auto">
  </audio>


  <!-- =========================================================
     博物馆信息卡

     作用：
     当 Image Target 被识别后，
     在屏幕上显示文物的基本信息。

     自己制作项目时，
     主要修改下面的文字内容。
========================================================= -->

  <div id="infoPanel">

    <div class="objectTitle">
      商代晚期青铜觥
    </div>

    <div class="objectInfo">
      约公元前 1100–1050 年<br>
      青铜｜礼仪酒器<br>
      馆藏：Smithsonian National Museum of Asian Art
    </div>

  </div>


  <!-- =========================================================
     开始探索提示

     初始状态隐藏。

     当中文语音讲解结束后，
     JavaScript 会显示这个提示。

     下一阶段：
     点击「开始探索」后，
     进入 3D 模型旋转与缩放交互。
========================================================= -->

  <!-- =========================================================
     开始探索

     中文讲解结束后显示。

     用户点击按钮后：
     1. 提示框消失
     2. 自动旋转停止，启用手势交互
========================================================= -->

  <div id="explorePrompt">

    <div class="exploreTitle">
      探索文物
    </div>

    <div class="exploreText">
      拖动模型进行旋转，<br>
      使用鼠标滚轮或双指捏合进行放大与缩小。
    </div>

    <button id="exploreButton">
      开始探索
    </button>

  </div>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false">
    </a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- =========================================================
     3D 模型 + 自动旋转

     结构分成两层：

     modelRoot：
     控制整个文物的位置和大小。

     spinRoot：
     专门负责自动旋转。
========================================================= -->

      <!-- MODEL ROOT：控制模型整体位置与大小 -->
      <a-entity id="modelRoot" position="0 0 0.1" scale="3 3 3">

        <!--
       AUTO ROTATION｜自动旋转

       property: rotation
       改变物体的旋转角度

       from: 0 0 0
       从 0° 开始

       to: 0 360 0
       绕 Y 轴旋转一整圈 360°

       loop: true
       无限循环

       dur: 10000
       一整圈需要 10,000 ms
       10 秒

       easing: linear
       保持匀速旋转
      -->

        <a-entity id="spinRoot" animation="
      property: rotation;
      from: 0 0 0;
      to: 0 360 0;
      loop: true;
      dur: 10000;
      easing: linear">

          <!-- 3D 模型___相对于MODEL ROOT 的位置（局部坐标系）-->
          <a-gltf-model src="./guang.glb" position="0 0 0" rotation="0 0 0">
          </a-gltf-model>

        </a-entity>

      </a-entity>

    </a-entity>

  </a-scene>

  <script>

    /* =========================================================
       音频交互控制
    
       整体逻辑：
    
       点击 "开始体验"
       ↓
       浏览器允许播放声音
       ↓
       扫描 Image Target
       ↓
       targetFound
       ↓
       背景音乐 + 中文讲解播放
    ========================================================= */


    /* ---------------------------------------------------------
       1. 找到网页中的元素
    --------------------------------------------------------- */

    const startScreen =
      document.querySelector("#startScreen");

    const startButton =
      document.querySelector("#startButton");

    const target =
      document.querySelector("#target");

    const bgMusic =
      document.querySelector("#bgMusic");

    const narration =
      document.querySelector("#narration");

    const infoPanel =
      document.querySelector("#infoPanel");

    const explorePrompt =
      document.querySelector("#explorePrompt");

    const exploreButton =
      document.querySelector("#exploreButton");

    /* 3D 模型交互控制节点 */
    const modelRoot =
      document.querySelector("#modelRoot");

    const spinRoot =
      document.querySelector("#spinRoot");
/* ---------------------------------------------------------
       2. 设置音量
    
       volume 范围：
    
       0   = 静音
       0.1 = 很低
       0.5 = 中等
       1   = 最大音量
    
       博物馆体验建议：
       背景音乐低
       讲解声音高
    --------------------------------------------------------- */

    bgMusic.volume = 0.8;

    narration.volume = 1.0;


    /* ---------------------------------------------------------
       3. 记录体验状态
    --------------------------------------------------------- */

    let experienceStarted = false;

    let targetVisible = false;

    let narrationFinished = false;

    let exploring = false;


    /* ---------------------------------------------------------
       4. 用户点击「开始体验」
    
       这一步非常重要：
    
       手机浏览器要求用户先进行一次操作，
       才允许网页播放声音。
    
       play → pause
       是为了提前“解锁”两个音频。
    --------------------------------------------------------- */

    startButton.addEventListener("click", async () => {

      try {

        /* 解锁背景音乐 */

        bgMusic.muted = true;

        await bgMusic.play();

        bgMusic.pause();

        bgMusic.currentTime = 0;

        bgMusic.muted = false;


        /* 解锁语音讲解 */

        narration.muted = true;

        await narration.play();

        narration.pause();

        narration.currentTime = 0;

        narration.muted = false;

      }

      catch (error) {

        console.log(
          "Audio unlock:",
          error
        );

      }


      /* 记录：用户已经开始体验 */

      experienceStarted = true;


      /* 隐藏开始按钮 */

      startScreen.style.display = "none";


      /*
         如果用户点击按钮的时候
         Target 已经在摄像头里，
         就立即播放音频。
      */

      if (targetVisible) {

        playAudio();

        infoPanel.style.display = "block";

      }

    });


    /* ---------------------------------------------------------
       5. 播放音频
    --------------------------------------------------------- */

    function playAudio() {

      /*
         如果用户还没有点击开始体验，
         不允许播放。
      */

      if (!experienceStarted) {

        return;

      }


      /* ---------- 背景音乐 ---------- */

      bgMusic.play().catch((error) => {

        console.log(
          "Background music error:",
          error
        );

      });


      /* ---------- 中文讲解 ---------- */

      if (!narrationFinished) {

        narration.play().catch((error) => {

          console.log(
            "Narration error:",
            error
          );

        });

      }

    }


    /* ---------------------------------------------------------
       6. 当 MindAR 识别到 Target
    --------------------------------------------------------- */

    target.addEventListener(
      "targetFound",
      () => {

        console.log(
          "🎯 TARGET FOUND"
        );

        targetVisible = true;


        /* 播放背景音乐和中文讲解 */

        playAudio();


        /* 显示 Museum Label */

        if (experienceStarted) {

          infoPanel.style.display = "block";

        }
        /* 如果语音之前已经讲完，重新识别 Target 时，直接显示「开始探索」。*/

        if (narrationFinished) {

          explorePrompt.style.display = "block";

        }
}
    );


    /* ---------------------------------------------------------
       7. 当 Target 离开摄像头
    
       暂停音频。
    
       注意：
       这里不是重新开始，
       下一次识别后会从暂停的位置继续播放。
    --------------------------------------------------------- */

    target.addEventListener(
      "targetLost",
      () => {

        console.log(
          "TARGET LOST"
        );

        targetVisible = false;

        /* 暂停声音 */
        bgMusic.pause();

        narration.pause();

        /* 隐藏 Museum Label */
        infoPanel.style.display = "none";

        /* 隐藏开始探索提示 */
        explorePrompt.style.display = "none";
}
    );


    /* ---------------------------------------------------------
       8. 当 37 秒中文讲解结束
    
       暂时只记录状态。
    
       利用这个 ended 事件：
    
       narration ended,记录 narrationFinished = true
       ↓
       显示「开始探索」
       
    --------------------------------------------------------- */

    narration.addEventListener(
      "ended",
      () => {

        /* 记录：讲解已经结束 */

        narrationFinished = true;


        console.log(
          "🔊 Narration Finished"
        );


        /*
           只有 Target 仍然在摄像头里时，
           才显示「开始探索」。
        */

        if (
          targetVisible &&
          !exploring
        ) {

          explorePrompt.style.display = "block";

        }

      }
    );

    /* ---------------------------------------------------------
       开始探索 / 进入手势交互

       用户点击「开始探索」
       ↓
       提示框消失
       ↓
       自动旋转停止
       ↓
       用户可以拖动旋转、滚轮/双指缩放
    --------------------------------------------------------- */

    exploreButton.addEventListener(
      "click",
      () => {

        exploring = true;

        /* 隐藏开始探索提示 */
        explorePrompt.style.display = "none";

        /* 停止自动旋转，并保留停止时的当前角度 */
        stopAutoRotation();

        console.log(
          "🖐️ Gesture Interaction Started"
        );

      }
    );


    /* =========================================================
       3D 模型手势控制

       Desktop：
       Mouse Drag  = Rotate
       Mouse Wheel = Zoom

       Mobile：
       One Finger  = Rotate
       Two Fingers = Pinch Zoom

       只有点击「开始探索」以后，手势交互才启用。
    ========================================================= */

    /* 当前模型大小：自动读取 modelRoot 的 scale */
    let currentScale =
      modelRoot.getAttribute("scale").x;

    /* 当前 Y 轴旋转角度 */
    let currentRotationY = 0;

    /* 缩放范围：初始大小的 0.5 倍到 7 倍 */
    const initialScale = currentScale;
    const minScale = initialScale * 0.5;
    const maxScale = initialScale * 7.0;


    /* ---------------------------------------------------------
       停止自动旋转
    --------------------------------------------------------- */

    function stopAutoRotation() {

      /* 读取动画当前角度，避免停止后跳回 0° */
      currentRotationY =
        THREE.MathUtils.radToDeg(
          spinRoot.object3D.rotation.y
        );

      /* 删除 A-Frame 自动旋转动画 */
      spinRoot.removeAttribute("animation");

      /* 保持停止时的当前角度 */
      spinRoot.setAttribute(
        "rotation",
        `0 ${currentRotationY} 0`
      );

    }


    /* ---------------------------------------------------------
       设置模型缩放
    --------------------------------------------------------- */

    function setModelScale(scale) {

      /* 防止模型缩得太小或放得太大 */
      currentScale =
        Math.max(
          minScale,
          Math.min(maxScale, scale)
        );

      /* X / Y / Z 使用相同数值，避免模型变形 */
      modelRoot.setAttribute(
        "scale",
        `${currentScale} ${currentScale} ${currentScale}`
      );

    }


    /* =========================================================
       POINTER EVENTS｜鼠标 + 触摸
    ========================================================= */

    const activePointers = new Map();

    let lastSingleX = null;
    let pinchStartDistance = null;
    let pinchStartScale = currentScale;


    /* 计算两个手指之间的距离 */
    function getPointerDistance() {

      const points =
        Array.from(activePointers.values());

      if (points.length < 2) {
        return 0;
      }

      const dx =
        points[0].x - points[1].x;

      const dy =
        points[0].y - points[1].y;

      return Math.sqrt(
        dx * dx + dy * dy
      );

    }


    /* ---------------------------------------------------------
       Pointer Down
    --------------------------------------------------------- */

    document.addEventListener(
      "pointerdown",
      (event) => {

        /* 只有进入探索模式以后才允许控制模型 */
        if (!exploring) {
          return;
        }

        /* 点击 UI 区域时，不让模型跟着转 */
        if (
          event.target.closest &&
          event.target.closest(
            "#startScreen, #explorePrompt, #infoPanel"
          )
        ) {
          return;
        }

        activePointers.set(
          event.pointerId,
          {
            x: event.clientX,
            y: event.clientY
          }
        );

        /* 一个手指 / 鼠标：准备旋转 */
        if (activePointers.size === 1) {
          lastSingleX = event.clientX;
        }

        /* 两个手指：记录捏合开始距离和模型大小 */
        if (activePointers.size === 2) {

          pinchStartDistance =
            getPointerDistance();

          pinchStartScale =
            currentScale;

          lastSingleX = null;
        }

      }
    );


    /* ---------------------------------------------------------
       Pointer Move
    --------------------------------------------------------- */

    document.addEventListener(
      "pointermove",
      (event) => {

        if (
          !exploring ||
          !activePointers.has(event.pointerId)
        ) {
          return;
        }

        /* 更新当前手指/鼠标位置 */
        activePointers.set(
          event.pointerId,
          {
            x: event.clientX,
            y: event.clientY
          }
        );


        /* ---------- 单指 / 鼠标拖动：旋转 ---------- */
        if (
          activePointers.size === 1 &&
          lastSingleX !== null
        ) {

          const dx =
            event.clientX - lastSingleX;

          /* 0.4 是旋转灵敏度；数字越大转得越快 */
          currentRotationY +=
            dx * 0.4;

          spinRoot.setAttribute(
            "rotation",
            `0 ${currentRotationY} 0`
          );

          lastSingleX =
            event.clientX;

        }


        /* ---------- 双指捏合：缩放 ---------- */
        if (
          activePointers.size === 2 &&
          pinchStartDistance
        ) {

          event.preventDefault();

          const newDistance =
            getPointerDistance();

          const ratio =
            newDistance / pinchStartDistance;

          setModelScale(
            pinchStartScale * ratio
          );

        }

      },
      {
        passive: false
      }
    );


    /* ---------------------------------------------------------
       Pointer Up / Cancel
    --------------------------------------------------------- */

    function endPointer(event) {

      activePointers.delete(
        event.pointerId
      );

      if (activePointers.size === 1) {

        const remainingPointer =
          Array.from(
            activePointers.values()
          )[0];

        lastSingleX =
          remainingPointer.x;

      } else {

        lastSingleX = null;

      }

      if (activePointers.size < 2) {
        pinchStartDistance = null;
      }

    }


    document.addEventListener(
      "pointerup",
      endPointer
    );

    document.addEventListener(
      "pointercancel",
      endPointer
    );


    /* ---------------------------------------------------------
      电脑鼠标滚轮缩放
    --------------------------------------------------------- */

    document.addEventListener(
      "wheel",
      (event) => {

        if (!exploring) {
          return;
        }

        event.preventDefault();

        if (event.deltaY < 0) {

          /* 滚轮向上：放大 */
          setModelScale(
            currentScale * 1.10
          );

        } else {

          /* 滚轮向下：缩小 */
          setModelScale(
            currentScale * 0.90
          );

        }

      },
      {
        passive: false
      }
    );

  </script>

</body>

</html>
